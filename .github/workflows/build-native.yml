name: Build native server

on:
  workflow_call:
    inputs:
      runner:
        description: The native GitHub-hosted runner
        type: string
        required: true
      target:
        description: The release artifact target
        type: string
        required: true
      arch:
        description: Optional cross-architecture selection for macOS
        type: string
        default: ''
      version:
        description: The planned version to stamp
        type: string
        required: true
      ref:
        description: The source commit to build
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v6
        with:
          distribution: ${{ inputs.target == 'Windows-arm64' && 'microsoft' || 'temurin' }}
          java-version: "25"

      - name: Install the toolchain
        uses: lukka/get-cmake@latest

      - name: Install ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          job-summary: ''
          max-size: 1200M
          key: ${{ inputs.arch && format('{0}-cross', inputs.target) || inputs.target }}

      - name: Restore the libc++
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: ~/libcxx-*
          key: libcxx-${{ inputs.target }}-${{ hashFiles('.github/scripts/select-compiler.sh') }}

      - name: Install the MinGW toolchain for Shim
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ inputs.target == 'Windows-arm64' && 'CLANGARM64' || 'CLANG64' }}
          update: false
          install: >-
            ${{ inputs.target == 'Windows-arm64' && 'mingw-w64-clang-aarch64' || 'mingw-w64-clang-x86_64' }}-clang
            ${{ inputs.target == 'Windows-arm64' && 'mingw-w64-clang-aarch64' || 'mingw-w64-clang-x86_64' }}-lld
            ${{ inputs.target == 'Windows-arm64' && 'mingw-w64-clang-aarch64' || 'mingw-w64-clang-x86_64' }}-ninja
            ${{ inputs.target == 'Windows-arm64' && 'mingw-w64-clang-aarch64' || 'mingw-w64-clang-x86_64' }}-zlib

      - name: Point the build at the MinGW toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: echo "BASALT_SHIM_MINGW_BIN=${{ steps.msys2.outputs.msys2-location }}\\${{ inputs.target == 'Windows-arm64' && 'clangarm64' || 'clang64' }}\\bin" >>"$GITHUB_ENV"

      - name: Select the compiler
        shell: bash
        env:
          BASALT_TARGET_ARCH: ${{ inputs.arch }}
        run: .github/scripts/select-compiler.sh

      - name: Configure
        shell: bash
        run: eval cmake --preset release -DCMAKE_BUILD_TYPE=Release "-DBASALT_VERSION=${{ inputs.version }}" $BASALT_CMAKE_ARGS

      - name: Build
        shell: bash
        run: cmake --build build/release -- -k 0

      - name: Test
        shell: bash
        run: ctest --test-dir build/release --output-on-failure

      - name: Check the macOS binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for binary in build/release/bin/*; do
              otool -L "$binary"
              if otool -L "$binary" | grep -q /opt/homebrew; then echo "$binary links Homebrew"; exit 1; fi
              otool -l "$binary" | grep -A4 LC_BUILD_VERSION | grep -q 'minos 13.0'
          done

      - name: Check the Linux binary keeps its symbols
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # The profiler names functions from the symbol table of the running binary.
          for binary in build/release/bin/*; do
              file "$binary"
              readelf -S "$binary" | grep -q ' \.symtab'
          done

      - name: Upload the binary
        uses: actions/upload-artifact@v7
        with:
          name: basalt-server-${{ inputs.target }}
          path: build/release/bin/

      - name: Check the architecture
        if: inputs.arch == 'x86_64'
        shell: bash
        run: file build/release/bin/* | grep -q x86_64

      - name: Report ccache statistics
        if: always()
        shell: bash
        run: .github/scripts/report-ccache.sh
