name: Build

on:
  push:
    branches: [main, cpp]
    paths-ignore: ['**.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  workflow_call:
    inputs:
      version:
        description: The version to stamp; empty derives one from the event
        type: string
        default: ''
      release:
        description: Build only the release targets
        type: boolean
        default: false
      ref:
        description: The commit to build
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Plan the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WANTED: ${{ inputs.version }}
        run: |
          if [ -n "$WANTED" ]; then
              echo "version=$WANTED" >>"$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
              .github/scripts/plan-version.sh nightly server-runtime/include/basalt/server/runtime/BuildInfo.hpp
          else
              .github/scripts/plan-version.sh ci server-runtime/include/basalt/server/runtime/BuildInfo.hpp
          fi

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: Linux-x64
          - os: ubuntu-24.04-arm
            target: Linux-arm64
          - os: macos-15
            target: macOS-x64
            arch: x86_64
          - os: macos-15
            target: macOS-arm64
          - os: windows-2025
            target: Windows-x64
          - os: windows-11-arm
            target: Windows-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v4
        if: matrix.target != 'Windows-arm64'
        with:
          distribution: temurin
          java-version: "25"

      - name: Install the toolchain
        uses: lukka/get-cmake@latest

      - name: Install ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          max-size: 1200M
          key: ${{ matrix.arch && format('{0}-cross', matrix.target) || matrix.target }}

      - name: Restore the libc++
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/libcxx-*
          key: libcxx-${{ matrix.target }}-${{ hashFiles('.github/scripts/select-compiler.sh') }}

      - name: Select the compiler
        shell: bash
        env:
          BASALT_TARGET_ARCH: ${{ matrix.arch }}
        run: .github/scripts/select-compiler.sh

      - name: Configure
        shell: bash
        run: eval cmake --preset release -DCMAKE_BUILD_TYPE=Release "-DBASALT_VERSION=${{ needs.plan.outputs.version }}" $BASALT_CMAKE_ARGS

      - name: Build
        shell: bash
        run: cmake --build build/release -- -k 0

      - name: Test
        shell: bash
        run: ctest --test-dir build/release --output-on-failure

      - name: Check the macOS binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for binary in build/release/bin/*; do
              otool -L "$binary"
              if otool -L "$binary" | grep -q /opt/homebrew; then echo "$binary links Homebrew"; exit 1; fi
              otool -l "$binary" | grep -A4 LC_BUILD_VERSION | grep -q 'minos 13.0'
          done

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: basalt-server-${{ matrix.target }}
          path: build/release/bin/

      - name: Check the architecture
        if: matrix.arch == 'x86_64'
        shell: bash
        run: file build/release/bin/* | grep -q x86_64

  android:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android-arm64
            preset: android-arm64
            machine: AArch64
          - target: Android-x64
            preset: android-x64
            machine: Advanced Micro Devices X86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ inputs.ref }}
      - uses: lukka/get-cmake@latest
      - uses: hendrikmuhs/ccache-action@v1
        with:
          max-size: 800M
          key: ${{ matrix.target }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install the Android NDK
        run: |
          sdkmanager 'ndk;29.0.14206865'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >>"$GITHUB_ENV"
      - name: Configure
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: cmake --preset "${{ matrix.preset }}" "-DBASALT_VERSION=$VERSION"
      - name: Build the executable and platform tests
        run: cmake --build "build/${{ matrix.preset }}" --target basalt-server wire-common-test wire-io-test server-random-test --parallel 4
      - name: Check the Android executable
        env:
          MACHINE: ${{ matrix.machine }}
        run: |
          binary=(build/${{ matrix.preset }}/bin/*)
          readelf -h "${binary[0]}" | grep -F "$MACHINE"
          readelf -l "${binary[0]}" | grep -F '/system/bin/linker64'
          if readelf -d "${binary[0]}" | grep NEEDED | grep -E 'libc\+\+_shared|libstdc\+\+|libgcc_s'; then
              echo 'The Android executable requires a non-system runtime'; exit 1
          fi
      - name: Enable KVM
        if: matrix.preset == 'android-x64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android 10
        if: matrix.preset == 'android-x64'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          script: .github/scripts/test-android.sh build/android-x64
      - uses: actions/upload-artifact@v4
        with:
          name: basalt-server-${{ matrix.target }}
          path: build/${{ matrix.preset }}/bin/
          if-no-files-found: error

  musl:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: Linux-musl-x64
          - os: ubuntu-24.04-arm
            target: Linux-musl-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ inputs.ref }}
      - name: Build and test on Alpine
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          docker run --rm -e VERSION -v "$PWD:/src" -w /src alpine:3.22 sh -ec '
            apk add --no-cache cmake ninja clang20 lld20 libc++-dev libc++-static llvm-libunwind-dev llvm-libunwind-static gcc g++ musl-dev linux-headers file binutils
            cmake --preset linux-musl -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
              -DCMAKE_CXX_FLAGS=-stdlib=libc++ "-DBASALT_VERSION=$VERSION"
            cmake --build --preset linux-musl --parallel 4
            ctest --preset linux-musl
            for binary in build/linux-musl/bin/*; do
              file "$binary"
              if readelf -l "$binary" | grep -q INTERP; then exit 1; fi
              if readelf -d "$binary" | grep -q NEEDED; then exit 1; fi
              .github/scripts/smoke-binary.sh "$binary"
            done
          '
      - uses: actions/upload-artifact@v4
        with:
          name: basalt-server-${{ matrix.target }}
          path: build/linux-musl/bin/
          if-no-files-found: error

  freebsd:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: FreeBSD-x64
          - arch: aarch64
            target: FreeBSD-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ inputs.ref }}
      - uses: actions/cache@v4
        with:
          path: build/freebsd-libcxx
          key: freebsd-14.5-${{ matrix.arch }}-libcxx-${{ hashFiles('.github/scripts/build-freebsd-libcxx.sh') }}
      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.5'
          arch: ${{ matrix.arch }}
          envs: VERSION
          cpu: 4
          mem: 8192
          prepare: pkg install -y cmake ninja llvm19 git
          run: |
            set -eu
            .github/scripts/build-freebsd-libcxx.sh
            prefix="$PWD/build/freebsd-libcxx"
            cmake --preset freebsd -DCMAKE_C_COMPILER=clang19 -DCMAKE_CXX_COMPILER=clang++19 \
              "-DCMAKE_CXX_FLAGS=-nostdinc++ -isystem $prefix/include/c++/v1" \
              -DCMAKE_EXE_LINKER_FLAGS=-nostdlib++ \
              "-DCMAKE_CXX_STANDARD_LIBRARIES=$prefix/lib/libc++.a $prefix/lib/libc++abi.a -lpthread" \
              "-DBASALT_VERSION=$VERSION"
            cmake --build --preset freebsd --parallel 4
            ctest --preset freebsd
            for binary in build/freebsd/bin/*; do
                file "$binary"
                ldd "$binary"
                .github/scripts/smoke-binary.sh "$binary"
            done
      - uses: actions/upload-artifact@v4
        with:
          name: basalt-server-${{ matrix.target }}
          path: build/freebsd/bin/
          if-no-files-found: error

  sanitize:
    if: ${{ !inputs.release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: lukka/get-cmake@latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          max-size: 800M
          key: sanitize

      - name: Select the compiler
        run: .github/scripts/select-compiler.sh

      - name: Configure with the address and undefined sanitizers
        run: eval cmake --preset asan $BASALT_CMAKE_ARGS

      - name: Build
        run: cmake --build build/asan

      - name: Test
        run: ctest --test-dir build/asan --output-on-failure

  format:
    if: ${{ !inputs.release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Select the compiler
        run: .github/scripts/select-compiler.sh

      - name: Check formatting
        run: |
          find server-* wire/wire-* -name '*.hpp' -o -name '*.cpp' \
            | grep -v third_party \
            | xargs clang-format-19 --dry-run --Werror

  nightly:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [plan, build, android, musl, freebsd]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    concurrency:
      group: nightly-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: basalt-server-*

      - name: Publish the nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-release.sh nightly "${{ needs.plan.outputs.version }}" "$GITHUB_SHA" artifacts
