name: Build

on:
  push:
    branches: [main, cpp]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: Linux-x64
          - os: ubuntu-24.04-arm
            target: Linux-arm64
          - os: macos-15-intel
            target: macOS-x64
          - os: macos-15
            target: macOS-arm64
          - os: windows-2025
            target: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install the toolchain
        uses: lukka/get-cmake@latest

      - name: Install ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          max-size: 1200M
          key: ${{ matrix.target }}

      - name: Select the compiler
        shell: bash
        run: .github/scripts/select-compiler.sh

      - name: Configure
        shell: bash
        run: eval cmake --preset release -DCMAKE_BUILD_TYPE=Release "-DBASALT_VERSION=26.3.${{ github.run_number }}" $BASALT_CMAKE_ARGS

      - name: Build
        shell: bash
        # The run number is the build half of the version: 26.3.<build>.
        run: cmake --build build/release -- -k 0

      - name: Test
        shell: bash
        run: ctest --test-dir build/release --output-on-failure

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: basalt-server-${{ matrix.target }}
          path: build/release/bin/

  sanitize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: lukka/get-cmake@latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          max-size: 800M
          key: sanitize

      - name: Select the compiler
        run: .github/scripts/select-compiler.sh

      - name: Configure with the address and undefined sanitizers
        run: eval cmake --preset asan $BASALT_CMAKE_ARGS

      - name: Build
        run: cmake --build build/asan

      - name: Test
        run: ctest --test-dir build/asan --output-on-failure

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Select the compiler
        run: .github/scripts/select-compiler.sh

      - name: Check formatting
        run: |
          find server-* wire/wire-* -name '*.hpp' -o -name '*.cpp' \
            | grep -v third_party \
            | xargs clang-format-19 --dry-run --Werror
