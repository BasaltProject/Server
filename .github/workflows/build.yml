name: Build

on:
  push:
    branches: [main, cpp]
    paths-ignore: ['**.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: The version to stamp; empty derives one from the event
        type: string
        default: ''
      release:
        description: Build only the release targets
        type: boolean
        default: false
      ref:
        description: The commit to build
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Plan the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WANTED: ${{ inputs.version }}
        run: |
          if [ -n "$WANTED" ]; then
              echo "version=$WANTED" >>"$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
              .github/scripts/plan-version.sh nightly server-runtime/include/basalt/server/runtime/BuildInfo.hpp
          else
              .github/scripts/plan-version.sh ci server-runtime/include/basalt/server/runtime/BuildInfo.hpp
          fi

  linux:
    name: ${{ matrix.target }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: Linux-x64
          - os: ubuntu-24.04-arm
            target: Linux-arm64
    uses: ./.github/workflows/build-native.yml
    with:
      runner: ${{ matrix.os }}
      target: ${{ matrix.target }}
      version: ${{ needs.plan.outputs.version }}
      ref: ${{ inputs.ref }}

  musl:
    name: ${{ matrix.target }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: Linux-musl-x64
          - os: ubuntu-24.04-arm
            target: Linux-musl-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          ref: ${{ inputs.ref }}
      - uses: actions/cache@v6
        with:
          path: build/musl-ccache
          key: ccache-${{ matrix.target }}-clang20-${{ github.sha }}
          restore-keys: ccache-${{ matrix.target }}-clang20-
      - name: Build and test on Alpine
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          docker run --rm -e VERSION -e CCACHE_DIR=/src/build/musl-ccache -e CCACHE_MAXSIZE=1200M -v "$PWD:/src" -w /src alpine:3.23 sh -ec '
            n=0
            until apk add --no-cache ccache cmake ninja clang20 lld20 libc++-dev libc++-static llvm-libunwind-dev llvm-libunwind-static gcc g++ musl-dev linux-headers file binutils bash curl openjdk25-jdk zlib-dev git zip unzip tar pkgconf; do
              n=$((n + 1)); [ "$n" -lt 4 ] || exit 1; sleep $((n * 15))
            done
            export JAVA_HOME=/usr/lib/jvm/default-jvm PATH=/usr/lib/jvm/default-jvm/bin:$PATH
            ccache --zero-stats
            trap ".github/scripts/report-ccache.sh build/musl-ccache-summary.md" EXIT
            cmake --preset linux-musl -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
              -DCMAKE_CXX_FLAGS=-stdlib=libc++ "-DCMAKE_EXE_LINKER_FLAGS=-nostdlib++ -fuse-ld=lld -static-libgcc" \
              "-DCMAKE_CXX_STANDARD_LIBRARIES=-Wl,-Bstatic -lc++ -lc++abi -lunwind -latomic -Wl,-Bdynamic" \
              -DCMAKE_TRY_COMPILE_PLATFORM_VARIABLES=CMAKE_CXX_STANDARD_LIBRARIES \
              "-DBASALT_VERSION=$VERSION"
            cmake --build --preset linux-musl --target wire-common-test wire-io-test --parallel 4
            ctest --preset linux-musl -R "^(wire-common-test|wire-io-test)$" --timeout 120
            cmake --build --preset linux-musl --parallel 4
            ctest --preset linux-musl --timeout 300
            for binary in build/linux-musl/bin/*; do
              file "$binary"
              # Only musl itself may stay dynamic, because the Bukkit layer has to dlopen Shim
              if readelf -d "$binary" | grep NEEDED | grep -v "libc.musl"; then exit 1; fi
              readelf -S "$binary" | grep -q " \.symtab"
              .github/scripts/smoke-binary.sh "$binary"
            done
          '
      - uses: actions/upload-artifact@v7
        with:
          name: basalt-server-${{ matrix.target }}
          path: build/linux-musl/bin/
          if-no-files-found: error

      - name: Report ccache statistics
        if: always()
        run: |
          if [ -f build/musl-ccache-summary.md ]; then
              cat build/musl-ccache-summary.md >>"$GITHUB_STEP_SUMMARY"
          fi

  windows:
    name: ${{ matrix.target }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: Windows-x64
          - os: windows-11-arm
            target: Windows-arm64
    uses: ./.github/workflows/build-native.yml
    with:
      runner: ${{ matrix.os }}
      target: ${{ matrix.target }}
      version: ${{ needs.plan.outputs.version }}
      ref: ${{ inputs.ref }}

  macos:
    name: ${{ matrix.target }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macOS-x64
            arch: x86_64
          - os: macos-15
            target: macOS-arm64
    uses: ./.github/workflows/build-native.yml
    with:
      runner: ${{ matrix.os }}
      target: ${{ matrix.target }}
      arch: ${{ matrix.arch }}
      version: ${{ needs.plan.outputs.version }}
      ref: ${{ inputs.ref }}

  android:
    name: ${{ matrix.target }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android-arm64
            preset: android-arm64
            machine: AArch64
          - target: Android-x64
            preset: android-x64
            machine: Advanced Micro Devices X86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          ref: ${{ inputs.ref }}
      - uses: lukka/get-cmake@latest
      - uses: hendrikmuhs/ccache-action@v1
        with:
          job-summary: ''
          max-size: 800M
          key: ${{ matrix.target }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
      - name: Install the Android NDK
        run: |
          n=0
          until sdkmanager 'ndk;29.0.14206865'; do
            n=$((n + 1)); [ "$n" -lt 4 ] || exit 1; sleep $((n * 15))
          done
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >>"$GITHUB_ENV"
      - name: Configure
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: cmake --preset "${{ matrix.preset }}" "-DBASALT_VERSION=$VERSION"
      - name: Build the executable and platform tests
        run: cmake --build "build/${{ matrix.preset }}" --target basalt-server wire-common-test wire-io-test wire-auth-test server-random-test --parallel 4
      - name: Check the Android executable
        env:
          MACHINE: ${{ matrix.machine }}
        run: |
          binary=(build/${{ matrix.preset }}/bin/*)
          readelf -h "${binary[0]}" | grep -F "$MACHINE"
          readelf -l "${binary[0]}" | grep -F '/system/bin/linker64'
          if readelf -d "${binary[0]}" | grep NEEDED | grep -E 'libc\+\+_shared|libstdc\+\+|libgcc_s'; then
              echo 'The Android executable requires a non-system runtime'; exit 1
          fi
      - name: Free disk space for the emulator
        if: matrix.preset == 'android-x64'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules
          df -h /
      - name: Enable KVM
        if: matrix.preset == 'android-x64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android 10
        if: matrix.preset == 'android-x64'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disk-size: 3072M
          script: .github/scripts/test-android.sh build/android-x64
      - uses: actions/upload-artifact@v7
        with:
          name: basalt-server-${{ matrix.target }}
          path: build/${{ matrix.preset }}/bin/
          if-no-files-found: error

      - name: Report ccache statistics
        if: always()
        shell: bash
        run: .github/scripts/report-ccache.sh

  freebsd:
    name: ${{ matrix.target }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: FreeBSD-x64
            cross: false
            timeout: 180
          - arch: aarch64
            target: FreeBSD-arm64
            cross: true
            timeout: 120
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          ref: ${{ inputs.ref }}
      - uses: lukka/get-cmake@latest
        if: matrix.cross
      - uses: actions/setup-java@v6
        if: matrix.cross
        with:
          distribution: temurin
          java-version: '25'
      - uses: hendrikmuhs/ccache-action@v1
        if: matrix.cross
        with:
          job-summary: ''
          max-size: 1200M
          key: FreeBSD-arm64-cross-clang19
      - name: Select the cross-compiler
        if: matrix.cross
        run: .github/scripts/select-compiler.sh
      - name: Extract the FreeBSD arm64 sysroot
        if: matrix.cross
        run: .github/scripts/setup-freebsd-sysroot.sh
      - name: Configure for FreeBSD arm64
        if: matrix.cross
        run: |
          root="$PWD/build/freebsd-sysroot"
          cmake --preset freebsd -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_SYSTEM_NAME=FreeBSD -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER_TARGET=aarch64-unknown-freebsd14.5 \
            -DCMAKE_CXX_COMPILER_TARGET=aarch64-unknown-freebsd14.5 \
            "-DCMAKE_SYSROOT=$root" \
            "-DCMAKE_CXX_FLAGS=-nostdinc++ -isystem $root/usr/include/c++/v1" \
            "-DCMAKE_EXE_LINKER_FLAGS=-nostdlib++ -fuse-ld=lld" \
            "-DCMAKE_CXX_STANDARD_LIBRARIES=$root/usr/lib/libc++.a $root/usr/lib/libcxxrt.a -lpthread" \
            -DCMAKE_TRY_COMPILE_PLATFORM_VARIABLES=CMAKE_CXX_STANDARD_LIBRARIES \
            -DCMAKE_ASM_COMPILER=clang-19 -DCMAKE_ASM_COMPILER_TARGET=aarch64-unknown-freebsd14.5 \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY "-DBASALT_VERSION=$VERSION"
      - name: Cross-build the executable and all tests
        if: matrix.cross
        env:
          CC: clang-19
          CXX: clang++-19
        run: |
          cmake --build --preset freebsd --target wire-common-test wire-io-test --parallel 4
          cmake --build --preset freebsd --parallel 4
          for binary in build/freebsd/bin/*; do
              readelf -h "$binary" | grep -F AArch64
              readelf -l "$binary" | grep -F /libexec/ld-elf.so.1
              if readelf -d "$binary" | grep NEEDED | grep -E 'libc\+\+|libcxxrt'; then exit 1; fi
          done
      - uses: actions/cache@v6
        if: ${{ !matrix.cross }}
        with:
          path: build/freebsd-ccache
          key: ccache-${{ matrix.target }}-clang21-${{ github.sha }}
          restore-keys: ccache-${{ matrix.target }}-clang21-
      - name: Verify on FreeBSD
        uses: vmactions/freebsd-vm@v1
        env:
          CCACHE_DIR: ${{ github.workspace }}/build/freebsd-ccache
          CCACHE_MAXSIZE: 1200M
        with:
          release: '14.5'
          arch: ${{ matrix.arch }}
          envs: VERSION CCACHE_DIR CCACHE_MAXSIZE
          cpu: 4
          mem: 8192
          prepare: ${{ matrix.cross && 'n=0; until pkg install -y cmake; do n=$((n + 1)); [ $n -lt 4 ] || exit 1; sleep 20; done' || 'n=0; until pkg install -y ccache cmake ninja bash curl openjdk25 git zip unzip pkgconf patchelf; do n=$((n + 1)); [ $n -lt 4 ] || exit 1; sleep 20; done; ln -sf /usr/local/bin/pkgconf /usr/local/bin/pkg-config' }}
          run: |
            set -eu
            if [ "${{ matrix.cross }}" = false ]; then
                ccache --zero-stats
                trap ".github/scripts/report-ccache.sh build/freebsd-ccache-summary.md" EXIT
                cmake --preset freebsd \
                  -DCMAKE_EXE_LINKER_FLAGS=-nostdlib++ \
                  -DCMAKE_TRY_COMPILE_PLATFORM_VARIABLES=CMAKE_CXX_STANDARD_LIBRARIES \
                  "-DCMAKE_CXX_STANDARD_LIBRARIES=/usr/lib/libc++.a /usr/lib/libcxxrt.a -lpthread" \
                  "-DBASALT_VERSION=$VERSION"
                cmake --build --preset freebsd --target wire-common-test wire-io-test --parallel 4
                ctest --preset freebsd -R '^(wire-common-test|wire-io-test)$' --timeout 120
                cmake --build --preset freebsd --parallel 4
            fi
            BASALT_TEST_SYSTEM_HTTPS_URL=https://piston-meta.mojang.com/mc/game/version_manifest_v2.json ctest --preset freebsd --timeout 300
            for binary in build/freebsd/bin/*; do
                file "$binary"
                ldd "$binary"
                .github/scripts/smoke-binary.sh "$binary"
            done
      - uses: actions/upload-artifact@v7
        with:
          name: basalt-server-${{ matrix.target }}
          path: build/freebsd/bin/
          if-no-files-found: error

      - name: Report ccache statistics
        if: always()
        run: |
          if [ "${{ matrix.cross }}" = true ]; then
              .github/scripts/report-ccache.sh
          elif [ -f build/freebsd-ccache-summary.md ]; then
              cat build/freebsd-ccache-summary.md >>"$GITHUB_STEP_SUMMARY"
          fi

  sanitize:
    if: ${{ !inputs.release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: lukka/get-cmake@latest

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Install ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          job-summary: ''
          max-size: 800M
          key: sanitize

      - name: Select the compiler
        run: .github/scripts/select-compiler.sh

      - name: Configure with the address and undefined sanitizers
        run: eval cmake --preset asan $BASALT_CMAKE_ARGS

      - name: Build
        run: cmake --build build/asan

      - name: Test
        run: ctest --test-dir build/asan --output-on-failure

      - name: Report ccache statistics
        if: always()
        shell: bash
        run: .github/scripts/report-ccache.sh

  format:
    if: ${{ !inputs.release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Check formatting
        run: |
          n=0
          until pipx install clang-format==19.1.7; do
            n=$((n + 1)); [ "$n" -lt 4 ] || exit 1; sleep $((n * 15))
          done
          find server-* wire/wire-* -name '*.hpp' -o -name '*.cpp' \
            | grep -v third_party \
            | xargs clang-format --dry-run --Werror

  nightly:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [plan, linux, musl, windows, macos, android, freebsd]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    concurrency:
      group: nightly-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: basalt-server-*

      - name: Publish the nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-release.sh nightly "${{ needs.plan.outputs.version }}" "$GITHUB_SHA" artifacts
