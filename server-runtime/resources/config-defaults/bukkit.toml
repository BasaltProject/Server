# Bukkit and Paper plugin compatibility: drop a plugin .jar into `plugins/` and it loads; every key is optional.

# "auto" starts Bukkit support when a Bukkit jar is present, true insists on it, false never starts it.
enabled = "auto"

# Fetch missing runtime libraries into `.basalt/bukkit/lib/`, checked by SHA-1. Turn off without network.
download = true

# A folder holding the runtime; empty looks in $BASALT_BUKKIT_HOME, `.basalt/bukkit/`, `runtime/`, then the binary dir.
runtime = ""

# Individual pieces, if they live somewhere else than the runtime folder.
libjvm = ""
boot-classpath = ""
runtime-jar = ""
libraries = ""
