# Bukkit and Paper plugin compatibility. Nothing here needs editing: drop a plugin .jar into `plugins/`
# next to your Lua packages and it loads.

# "auto" starts Bukkit support when a Bukkit jar is present, true insists on it (a missing runtime is an error),
enabled = "auto"

# Fetch the libraries the runtime is missing (Maven Central, the Paper API) into `.basalt/bukkit/lib/`,
download = true

# A folder that holds the runtime: shim/libjvm.so, shim/classpath.jar, basalt-bukkit.jar, lib/ and addons/.
runtime = ""

# Individual pieces, if they live somewhere else than the runtime folder.
libjvm = ""
boot-classpath = ""
runtime-jar = ""
libraries = ""
