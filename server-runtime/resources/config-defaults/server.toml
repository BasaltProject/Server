# Basalt server configuration, generated once with vanilla-parity defaults.
# Delete a value and restart to have it regenerated.
#
# This is one file of several under config/. Options move out of here as their own domain grows a
# file of its own (worlds, permission groups, server list, commands); see the file each one lands
# in for where an option went.

[server]
# How many players can be connected at once. Vanilla ships 20; this ships 80,
# because 20 is a number from 2010 and nothing in the server cares. What the list
# *shows* is a separate thing, in server_list.toml, since a profile can advertise
# whatever it likes without changing who actually gets in.
max-players = 80

# Verify players against Mojang's session server. Disabling this accepts any
# claimed username with no verification (vanilla's "cracked" mode).
online-mode = true

# Require signed chat from every player, as vanilla's enforce-secure-profile does.
# Only takes effect in online mode and while Mojang's public keys could be
# fetched at startup; unsigned chat from a player then is refused.
enforce-secure-profile = true

# Link the client lists as "Report Bug" in its pause menu, as vanilla's bug-report-link does.
# Only http and https are accepted; empty sends none.
bug-report-link = ""

# Resource pack offered to every player on joining, as vanilla's resource-pack does. Empty sends none.
resource-pack = ""

# SHA-1 of the pack, 40 hex digits. Without it the client only refetches when the URL changes.
resource-pack-sha1 = ""

# UUID that identifies the pack to the client; derived from the URL when empty.
resource-pack-id = ""

# Kick players who decline the pack.
require-resource-pack = false

# Message shown with the offer, as a JSON text component. Empty shows none.
resource-pack-prompt = ""

# Game mode new players join in: survival, creative, adventure or spectator.
gamemode = "survival"

# Only let players on the whitelist in. Who is on it is state, not configuration:
# it lives in players.db and is edited with /whitelist add and /whitelist remove.
# /whitelist on and off move this for the run; a restart follows this file again.
whitelist = false

[network]
# The two editions are two doors into the same server: the same worlds, the same
# players, the same chat. Neither is a layer on top of the other, so each one has
# its own table here with its own port and its own answer to "how old a client
# may be".

[network.java]
# Whether Java Edition clients are let in at all. Off makes this a Bedrock-only
# server, which is a real thing to want; both off is refused, because then
# nobody can join.
enabled = true

# Literal IPv4 or IPv6 listen address. Use 127.0.0.1 for a local proxy backend.
bind = "0.0.0.0"
# Accept IPv4 on an IPv6 listener only when explicitly enabled.
dual-stack = false

# Port the server listens on.
port = 25565

# Versions this server translates. "all" is everything this build knows how to
# do, so updating the server adds versions without editing this file. A list of
# protocol numbers fixes it to those: backwards = [775, 774].
# An empty list leaves only the native version.
backwards = "all"

# A client newer than this server: "accept" lets it in, "warn" lets it in and
# says so in the log, "refuse" turns it away with an explanation.
#
# It is "refuse" because a newer client cannot finish joining: measured between
# 26.2 and the first 26.3 snapshot, ten packets of the configuration phase moved
# and every block state number changed. Letting it in means it disconnects
# halfway through with a decoding error instead of reading why. "accept" is
# there for whoever wants to try their luck the day a version lands.
future-protocols = "refuse"

# Snapshots are recognised on their own (bit 30 of the protocol number) and get
# their own answer, because a development version changes from one day to
# the next.
snapshots = "refuse"

# What to do about content this server has and the client's version never had.
#
# It is shown something similar instead, which is all that client can draw. With
# this on, what stands in is also renamed to what it really is, so a 26.2 block
# reads "Cinnabar (26.2)" in the inventory rather than "Red Sandstone". An item
# somebody named themselves keeps that name.
name-substitutes = true

[network.bedrock]
# Minecraft Bedrock clients (phone, console, Windows). On by default: nobody
# should have to configure being able to join.
enabled = true

# Bedrock speaks its own protocol over UDP, so it needs a port of its own. 19132
# is the one every Bedrock client tries first.
port = 19132

# What goes in front of a Bedrock player's name inside the server, so a Steve
# from each edition is two people and not one. Set it to "" on a server where
# only Bedrock players join, and then two accounts with the same name are two
# players shown with the same name.
prefix = "."

# Which Bedrock protocols may in. "all" is everything this build speaks, so
# updating the server adds versions without editing this file. A list fixes it
# to those: protocols = [2168].
#
# Bedrock has no launcher to pick a version in, so nobody is on an old one on
# purpose: the window is the handful of protocols that devices are still being
# updated from, and what falls out of it is retired rather than kept for ever.
protocols = "all"

# A Bedrock client newer than anything this server speaks. Bedrock updates
# itself and will not let anyone stay behind, so the day a version lands half
# the players are locked out until the server is updated. "warn" lets them in
# and says so, "accept" lets them in quietly, "refuse" turns them away with the
# screen that offers to update the server instead.
future-protocols = "warn"

# A proxy in front of this server (BungeeCord, Waterfall, Velocity, Gate) connects
# on behalf of every player, so without forwarding the whole server sees one address
# and one offline uuid: the proxy's. Forwarding is how the proxy passes on who is
# really there, and every mode below replaces the login handshake, so the proxy
# authenticates against Mojang and this server does not. Set online-mode = false
# above when you turn any of them on.
#
# Leave this alone unless there is a proxy. A server reachable from the internet
# with forwarding on and no secret lets anybody claim to be anybody.
[network.forwarding]
# Which proxy is speaking for the players, if any:
#
#   none         Nobody is. This server authenticates its own players.
#   bungeecord   BungeeCord's ip_forward. NO SECRET: the data rides on the handshake
#                and nothing proves it came from the proxy, so this port must be
#                unreachable from anywhere but the proxy. Enable ip_forward on it.
#   bungeeguard  The same, plus the token BungeeGuard injects. Put the proxy's
#                token in tokens below.
#   safenet      The same idea with SafeNET's passphrase and property name. Put the
#                proxy's passphrase in tokens below.
#   velocity     Velocity's modern forwarding, signed with a shared secret. Set
#                player-info-forwarding-mode = "modern" on the proxy and copy its
#                forwarding.secret into secret below. The only mode that cannot be
#                forged, so the only one that is safe on a reachable port.
#   basalt       Basalt Proxy's signed forwarding: this server issues a one-time
#                challenge and accepts only a signature from a key listed in
#                trusted-keys. It holds public keys only, so a leaked config
#                forges nothing. Safe on a reachable port.
mode = "none"

# The shared secret for mode = "velocity". This is the content of the proxy's
# forwarding.secret file, not the path to it.
secret = ""

# The public keys (64 hex characters each) accepted for mode = "basalt". The proxy
# prints its key on first start. Listing two lets a key be rotated without downtime.
trusted-keys = []

# This backend's own name for mode = "basalt". It is part of what the proxy signs, so a
# signature collected by another backend is useless here.
backend-id = ""

# Offers the session envelope to the proxy for mode = "basalt": when the proxy accepts, it forwards each
# player's original packets and this server translates them, instead of the proxy doing it. Off by default.
session-envelope = false

# The tokens accepted for mode = "bungeeguard" or "safenet". More than one so a key
# can be rotated without a restart of everything at once.
tokens = []

# The property SafeNET carries its passphrase in, if you changed property-name.handshake
# on the proxy. Ignored by every other mode.
property-name = "safe_net_passphrase"

[performance]
# Count noise evaluations, biome lookups and per-phase timings while generating
# chunks, then log a report once the startup chunks are ready. Diagnostics only:
# it also forces startup generation onto a single thread so the counts are exact,
# so leave it off unless you are measuring.
generation-metrics = false

# NO VANILLA. With this on, a world is split into regions that tick independently:
# two of them stop having a fixed order of tick between each other, and what crosses
# a border is deferred a tick. It only pays off when the players are spread out; a
# hundred of them in the same town are one region either way.
#
# Splitting itself is not built yet, so today this only says which mode you asked
# for: every world is still one region.
regional = false

# How many regions tick at once, with regional = true. "auto" works it out from the
# cores available. Ignored while regional is off, where there is one region a world.
region-threads = "auto"

[plugins]
# Whether the plugins folder is looked at. Off means nothing is loaded or compiled.
enabled = true

# What one plugin may run in a single turn, in Lua instructions. Refilled on every entry,
# so it caps one handler and not the whole tick. Measured: 250,000 is about 13ms here.
instructions-per-turn = 250000

# The most memory one plugin's own objects may take, in megabytes.
memory-mb = 32

# How many copies of each plugin run at once. One is what a server wants; more is a
# development switch that makes a plugin assuming there is only one of it fail here.
test-lanes = 1

# The data of a plugin that is no longer installed: "warn" names it at every startup,
# "quiet" stops asking. Nothing is ever deleted on its own: /plugins purge does that.
orphan-data = "warn"

# The public keys, in hex, whose signature lets a plugin's compiled Lua (.luac) load. A package with
# bytecode and no signature from one of these is refused, because bytecode is not checked the way source is.
trusted-keys = []

# What each plugin may reach beyond its own sandbox: "packets" sees everyone's chat,
# "network" talks past the client, "commands" runs as the console. A plugin that asks for
# one and is not listed here loads without it and says so. Entries go below the header.
[plugins.allow]
# arena = ["packets"]
# lobby = ["network", "commands"]

[datapacks]
# The data packs a brand new world starts with, and the ones it leaves off: vanilla's
# initial-enabled-packs and initial-disabled-packs. Read once, when the default world is
# created; from then on the world keeps its own list, changed with /datapack. Packs go in
# the default world's datapacks folder, as a folder or a .zip, and are named file/<name>.
initial-enabled = ["vanilla"]
initial-disabled = []

# What the commands in a function may do, 1 to 4. Vanilla's function-permission-level.
function-permission-level = 2

[logging]
# One of: trace, debug, info, warn, error.
level = "info"

# Mirror everything the console shows into .basalt/logs/latest.log, archiving the
# previous run as .basalt/logs/archive/<date>-<n>.log.gz on every start.
file = true

# How many days of archived logs to keep. 0 keeps them forever.
keep-days = 14

# Colour the console output. One of: auto, always, never. "auto" colours only when
# writing to a terminal, so redirected output and log files stay clean.
color = "auto"
