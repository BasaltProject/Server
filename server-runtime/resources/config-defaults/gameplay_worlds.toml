
# Gameplay rules, ported from the options Purpur offers. Applied when the world loads: restart to change them.

[defaults.gameplay.blocks]
# Block behaviour.
# Adjacent water sources that turn flowing water into a new source (vanilla 2). NOT VANILLA if changed.
water-infinite-required-sources = 2
# Adjacent lava sources that turn flowing lava into a new source. -1 leaves it to the lava_source_conversion game rule (vanilla).
lava-infinite-required-sources = -1
# Ticks between lava flow steps in the Nether (vanilla 10).
lava-speed-nether = 10
# Ticks between lava flow steps outside the Nether (vanilla 30).
lava-speed-not-nether = 30
# Most blocks a sponge may absorb in one go, itself included (vanilla 65).
sponge-absorption-area = 65
# How far from the sponge water is looked for, in blocks (vanilla 6).
sponge-absorption-radius = 6
# Most blocks one piston may push (vanilla 12).
piston-block-push-limit = 12
# How many powered rails away a signal still reaches (vanilla 8).
powered-rail-activation-range = 8
# NOT VANILLA when true. A sneaking player standing on magma is hurt too.
magma-block-damage-when-sneaking = false
# Sleeping in a bed outside the overworld explodes it (vanilla true). False makes the use do nothing.
bed-explode = true
# Power of that explosion (vanilla 5.0).
bed-explosion-power = 5.0
# The bed explosion starts fires (vanilla true).
bed-explosion-fire = true
# A campfire is lit when placed (vanilla true). Placed in water it is never lit.
campfire-lit-when-placed = true
# A cactus breaks when a solid block touches its side (vanilla true).
cactus-breaks-from-solid-neighbors = true
# Coral dies a few seconds after it leaves water (vanilla true).
coral-die-outside-water = true
# NOT VANILLA when true. A chest opens even with a solid block on top (vanilla false).
chest-open-with-solid-block-on-top = false
# NOT VANILLA when true. A sponge soaks up lava as well as water.
sponge-absorbs-lava = false
# NOT VANILLA when true. A sponge turns mud it touches into clay.
sponge-absorbs-water-from-mud = false
# NOT VANILLA when true. A note block sounds even with a block on top.
note-block-ignore-above = false
# How far a one-level beacon reaches, in blocks (vanilla 20).
beacon-effect-range-level-1 = 20
# Range of a two-level beacon (vanilla 30).
beacon-effect-range-level-2 = 30
# Range of a three-level beacon (vanilla 40).
beacon-effect-range-level-3 = 40
# Range of a four-level beacon (vanilla 50).
beacon-effect-range-level-4 = 50
# NOT VANILLA when true. Tinted glass above a beacon no longer stops its effects.
beacon-allow-effects-with-tinted-glass = false
# A charged respawn anchor explodes when used outside the Nether (vanilla true). False makes the use do nothing.
respawn-anchor-explode = true
# Power of that explosion (vanilla 5.0).
respawn-anchor-explosion-power = 5.0
# That explosion starts fires (vanilla true).
respawn-anchor-explosion-fire = true
# An end crystal without its base plate explodes when destroyed (vanilla true).
end-crystal-baseless-explode = true
# Power of that explosion (vanilla 6.0).
end-crystal-baseless-explosion-power = 6.0
# That explosion starts fires (vanilla false).
end-crystal-baseless-explosion-fire = false
# An end crystal with its base plate explodes when destroyed (vanilla true).
end-crystal-base-explode = true
# Power of that explosion (vanilla 6.0).
end-crystal-base-explosion-power = 6.0
# That explosion starts fires (vanilla false).
end-crystal-base-explosion-fire = false
# NOT VANILLA when true. End crystals can be placed on any block, not only obsidian and bedrock.
end-crystal-place-anywhere = false
# The dragon egg teleports when clicked or hit (vanilla true).
dragon-egg-teleport = true
# NOT VANILLA when above 0. Health a player loses per hit when standing on a stonecutter.
stonecutter-damage = 0.0
# NOT VANILLA when true. A spawner stops while it is powered by redstone.
spawner-deactivate-by-redstone = false
# How far a lightning rod pulls a strike in, in blocks (vanilla 128).
lightning-rod-range = 128
# NOT VANILLA when true. Nothing tramples farmland by landing on it.
farmland-disable-trampling = false
# NOT VANILLA when true. Only players trample farmland.
farmland-only-players-trample = false
# NOT VANILLA when true. Feather falling at least as deep as the fall stops trampling.
farmland-feather-fall-distance-affects-trampling = false
# NOT VANILLA when 0 or more. Trample whenever the fall is at least this far, with no random roll. -1 keeps vanilla.
farmland-trample-height = -1.0
# Age at which kelp stops growing taller, 0 to 25 (vanilla 25).
kelp-max-growth-age = 25
# Age at which cave vines stop growing, 0 to 25 (vanilla 25).
cave-vines-max-growth-age = 25
# Age at which twisting vines stop growing, 0 to 25 (vanilla 25).
twisting-vines-max-growth-age = 25
# Age at which weeping vines stop growing, 0 to 25 (vanilla 25).
weeping-vines-max-growth-age = 25
# Ticks a big dripleaf stays unstable before it tilts (vanilla 10).
big-dripleaf-tilt-delay-unstable = 10
# Ticks a big dripleaf stays partly tilted (vanilla 10).
big-dripleaf-tilt-delay-partial = 10
# Ticks a big dripleaf stays fully tilted before it rights itself (vanilla 100).
big-dripleaf-tilt-delay-full = 100
# NOT VANILLA when true. A bubble column over magma pushes up instead of pulling down.
magma-block-reverse-bubble-column-flow = false
# NOT VANILLA when true. A bubble column over soul sand pulls down instead of pushing up.
soul-sand-reverse-bubble-column-flow = false
# Each repair makes the next one dearer (vanilla true). False keeps repairs at their base cost.
anvil-cumulative-cost = true
# Bees a hive can hold (vanilla 3). A hive with its own MaxBees keeps that.
beehive-max-bees-inside = 3
# NOT VANILLA when true. Bone meal grows a cactus one block taller, up to three.
cactus-affected-by-bonemeal = false
# NOT VANILLA when true. Bone meal grows sugar cane one block taller, up to three.
sugar-cane-affected-by-bonemeal = false
# NOT VANILLA when true. Bone meal ages nether wart by one stage.
nether-wart-affected-by-bonemeal = false
# "default" follows the mob_griefing game rule, "true" or "false" forces whether mobs trample farmland.
farmland-mob-griefing-override = "default"
# "default" follows the mob_griefing game rule, "true" or "false" forces whether a large fireball sets fire where it lands.
fireballs-mob-griefing-override = "default"
# NOT VANILLA when true. Two observers facing each other no longer set one another off, which ends observer clocks.
observer-disable-clock = false
# NOT VANILLA when above 0. End crystals packed more than this many into one another explode.
end-crystal-cramming-amount = 0
# NOT VANILLA when true. A bed that explodes for players outside the overworld also explodes under a sleeping villager.
bed-explode-on-villager-sleep = false
# NOT VANILLA when true. Sneaking while breaking a double slab breaks only the half you are looking at.
slab-break-individual-slabs-when-sneaking = false
# NOT VANILLA when true. A pickaxe (iron or better) with Silk Touch drops the spawner with its mob.
silk-touch-spawner-enabled = false
# Silk Touch level the pickaxe needs to take a spawner.
silk-touch-minimal-level = 1
# NOT VANILLA when true. A ripe wheat, carrot, potato or beetroot crop broken with a hoe is replanted for one of its seeds.
hoe-replant-crops = false
# NOT VANILLA when true. Ripe nether wart broken with a hoe is replanted for one of its seeds.
hoe-replant-nether-warts = false
# NOT VANILLA when true. `&` colour codes (and `&#rrggbb`) typed on a sign colour its text.
sign-allow-colors = false
# NOT VANILLA when true. `&` colour codes typed into an anvil rename colour the item name.
anvil-allow-colors = false
# NOT VANILLA when true, with anvil-allow-colors. The typed name is read as MiniMessage instead of `&` codes.
anvil-use-mini-message = false
# Chance per random tick that a turtle egg on sand cracks or hatches (the 26.3 turtle_egg_hatch_chance attribute, vanilla 0.002).
turtle-egg-hatch-chance = 0.002
# "default" follows mob_griefing, "true" or "false" forces whether mobs landing on turtle eggs break them. Players always can.
turtle-egg-mob-griefing-override = "default"

[defaults.gameplay.mechanics]
# Rules of the world that are not one block or item.
# Ticks between player drowning hits once the air is gone (vanilla 20).
drowning-ticks-per-damage = 20
# Health lost by one player drowning hit, 2.0 being one heart (vanilla 2.0).
drowning-damage = 2.0
# Health restored by one regeneration pulse on a player (vanilla 1.0).
health-regen-amount = 1.0
# Health lost by one poison pulse on a player (vanilla 1.0).
poison-degeneration-amount = 1.0
# Health lost by one wither pulse on a player (vanilla 1.0).
wither-degeneration-amount = 1.0
# Exhaustion added per tick by the hunger effect, per level (vanilla 0.005).
hunger-exhaustion-amount = 0.005
# Durability an elytra loses every second of flight (vanilla 1).
elytra-damage-per-second = 1
# NOT VANILLA when above 0. Extra durability an elytra loses per firework boost.
elytra-damage-per-firework-boost = 0
# Milk clears bad omen and raid omen (vanilla true). False lets them survive.
milk-cures-bad-omen = true
# Milk clears beneficial effects too (vanilla true).
milk-clears-beneficial-effects = true
# NOT VANILLA when above 0. Seconds a player must wait before starting another raid.
raid-cooldown-seconds = 0
# NOT VANILLA when above 0. Seconds a player must wait before feeding the same kind of animal into love again.
animal-breeding-cooldown-seconds = 0
# Skipping the night by sleeping clears rain (vanilla true).
rain-stops-after-sleep = true
# Skipping the night by sleeping clears thunder (vanilla true).
thunder-stops-after-sleep = true
# Ticks the bright half of the day lasts (vanilla 12000). NOT VANILLA if changed.
daylight-daytime-ticks = 12000
# Ticks the dark half of the day lasts (vanilla 12000). NOT VANILLA if changed.
daylight-nighttime-ticks = 12000
# Ticks after a player hit a mob during which its death counts as a player kill for drops and experience (vanilla 100). Melee only.
mob-last-hurt-by-player-time = 100
# Mobs and other non-player entities can travel through portals (vanilla true).
entities-can-use-portals = true
# NOT VANILLA when true. Riders are put out of a boat as soon as it runs aground.
boat-eject-players-on-land = false

[defaults.gameplay.player]
# Player rules.
# Damage multiplier of a player critical hit (vanilla 1.5).
critical-damage-multiplier = 1.5
# NOT VANILLA when true. A totem anywhere in the inventory saves from death, not only in a hand.
totem-of-undying-works-in-inventory = false
# Ticks a player waits between picking up experience orbs (vanilla 2).
exp-pickup-delay-ticks = 2
# Sleeping through the night can skip it (vanilla true). False keeps the night whatever the sleepers.
can-skip-night = true
# NOT VANILLA when true. Monsters near a bed no longer stop a player sleeping.
sleep-ignore-nearby-mobs = false
# NOT VANILLA when true. A creative player kills whatever they hit in one blow.
creative-one-punch = false

[defaults.gameplay.items]
# Item and projectile rules.
# Fall damage dealt to the thrower when a pearl lands (vanilla 5.0).
ender-pearl-damage = 5.0
# Ticks before a player can throw another ender pearl (vanilla 20).
ender-pearl-cooldown = 20
# The same for a creative player (vanilla 20).
ender-pearl-creative-cooldown = 20
# Chance that a landing pearl spawns an endermite (vanilla 0.05).
ender-pearl-endermite-spawn-chance = 0.05
# Damage a snowball deals. -1 is vanilla: nothing, or 3 to a blaze.
snowball-damage = -1
# Inaccuracy of an arrow shot from a bow; 0 flies straight (vanilla 1.0).
projectile-offset-bow = 1.0
# Inaccuracy of a crossbow bolt (vanilla 1.0).
projectile-offset-crossbow = 1.0
# Inaccuracy of a thrown egg (vanilla 1.0).
projectile-offset-egg = 1.0
# Inaccuracy of a thrown ender pearl (vanilla 1.0).
projectile-offset-ender-pearl = 1.0
# Inaccuracy of a thrown splash or lingering potion (vanilla 1.0).
projectile-offset-throwable-potion = 1.0
# Inaccuracy of a thrown trident (vanilla 1.0).
projectile-offset-trident = 1.0
# Inaccuracy of a thrown snowball (vanilla 1.0).
projectile-offset-snowball = 1.0
# Inaccuracy of a thrown wind charge (vanilla 1.0).
projectile-offset-wind-charge = 1.0
# Top speed of a minecart in blocks per tick, when minecart_improvements is off (vanilla 0.4).
minecart-max-speed = 0.4
# NOT VANILLA when true. A minecart can be placed on any block, not only on rails.
minecart-place-anywhere = false
# Speed a powered rail adds to a minecart, when minecart_improvements is off (vanilla 0.06).
powered-rail-boost-modifier = 0.06
# NOT VANILLA when below 0. A loyal trident that sinks under this height flies home instead of being lost.
trident-loyalty-void-return-height = 0.0
# A shulker box item that burns, blows up or is pricked away spills its contents (vanilla true).
shulker-box-drop-contents-when-destroyed = true
